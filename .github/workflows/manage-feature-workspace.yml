# Generated by Install-ProjectWorkflows.ps1 using PROJECT-DETAILS.txt.
# Do not add project-level Actions variables for these project values.

name: Manage Feature Workspace

run-name: >-
  ${{ inputs.workspace_action }} workspace for
  ${{ inputs.developer_alias || 'Kayode' }}

on:
  workflow_dispatch:
    inputs:
      workspace_action:
        description: Prepare or remove a developer workspace
        required: true
        default: PrepareOrReuse
        type: choice
        options:
          - PrepareOrReuse
          - DeleteEnvironment

      developer_alias:
        description: Short developer identifier
        required: true
        default: "Kayode"
        type: string

      developer_upn:
        description: Developer Microsoft 365 email address
        required: false
        default: "kayode.ajayi@veldarr.com"
        type: string

      source_environment:
        description: Source environment name, URL, ID or unique name
        required: false
        default: ""
        type: string

      source_solution_name:
        description: Solution unique name in the source environment
        required: false
        default: "ChessPlayingAgent"
        type: string

      solution_folder:
        description: Repository folder to use for this solution run
        required: true
        default: "chess-demo"
        type: string

      workspace_environment:
        description: >-
          PrepareOrReuse: exact environment display name, or leave blank to
          generate one. DeleteEnvironment: environment name, URL or ID.
        required: false
        default: ""
        type: string

      workspace_environment_domain:
        description: Dataverse domain used only when creating a new environment
        required: false
        default: ""
        type: string

      workspace_environment_type:
        description: Environment type used only when creating a new environment
        required: true
        default: Developer
        type: choice
        options:
          - Developer
          - Sandbox
          - Trial

      workspace_environment_region:
        description: Region used only when creating a new environment
        required: true
        default: "europe"
        type: string

      workspace_environment_currency:
        description: Currency code used only when creating a new environment
        required: true
        default: "GBP"
        type: string

      workspace_environment_language:
        description: Language used only when creating a new environment
        required: true
        default: "English"
        type: string

      workspace_environment_mode:
        description: Reuse an existing environment or require a new one
        required: true
        default: ReuseOrCreate
        type: choice
        options:
          - ReuseOrCreate
          - CreateOnly

      deletion_confirmation:
        description: Required only for deletion. Enter DELETE:resolved-environment-name
        required: false
        default: ""
        type: string

      commit_baseline_to_branch:
        description: Commit the source-environment baseline to this branch
        required: true
        default: true
        type: boolean

      baseline_commit_message:
        description: Baseline commit message
        required: true
        default: "Sync ChessPlayingAgent baseline from source environment"
        type: string

permissions:
  contents: write

jobs:
  manage:
    uses: KayodeAjayi-Veldarr/power-platform-workflows/.github/workflows/manage-feature-workspace.yml@main

    with:
      workspace_action: ${{ inputs.workspace_action }}

      project_key: "chess-demo"
      branch_ref: ${{ github.ref_name }}
      base_branch: "main"

      developer_alias: ${{ inputs.developer_alias }}
      developer_upn: ${{ inputs.developer_upn }}

      source_environment: ${{ inputs.source_environment }}
      source_solution_name: ${{ inputs.source_solution_name || 'ChessPlayingAgent' }}
      source_export_managed: false
      source_export_async: true

      solution_name: "ChessPlayingAgent"
      solution_project_folder: ${{ inputs.solution_folder }}
      solution_source_folder: ${{ format('{0}/src', inputs.solution_folder) }}
      solution_package_type: Unmanaged
      deployment_settings_file: ""

      commit_baseline_to_branch: ${{ inputs.commit_baseline_to_branch }}
      baseline_commit_message: ${{ inputs.baseline_commit_message }}

      workspace_environment: ${{ inputs.workspace_environment }}
      workspace_environment_domain: ${{ inputs.workspace_environment_domain }}
      workspace_environment_suffix: "DEV"
      workspace_environment_mode: ${{ inputs.workspace_environment_mode }}
      workspace_environment_type: ${{ inputs.workspace_environment_type }}
      workspace_environment_region: ${{ inputs.workspace_environment_region }}
      workspace_environment_currency: ${{ inputs.workspace_environment_currency }}
      workspace_environment_language: ${{ inputs.workspace_environment_language }}
      workspace_environment_templates: ""
      workspace_environment_security_group_id: ""

      environment_create_async: true

      assign_automation_user: true
      automation_role: "System Administrator"

      assign_developer: true
      developer_role: "System Administrator"

      force_overwrite: true
      publish_changes: true
      asynchronous_import: false

      deletion_confirmation: ${{ inputs.deletion_confirmation }}
      expected_environment_name_prefix: "chess-demo-"
      allowed_environment_types: Developer,Sandbox,Trial,SubscriptionBasedTrial
      asynchronous_delete: true

      max_async_wait_minutes: 60
      environment_lookup_attempts: 20
      environment_lookup_delay_seconds: 30

      upload_solution_artifact: true
      artifact_retention_days: 7

      next_step_message: >-
        Open ChessPlayingAgent and begin work on the selected feature branch.

    secrets:
      pp_tenant_id: ${{ secrets.PP_TENANT_ID }}
      pp_app_id: ${{ secrets.PP_APP_ID }}
      pp_client_secret: ${{ secrets.PP_CLIENT_SECRET }}

      # Uncomment only when the source environment uses different credentials.
      # source_pp_tenant_id: ${{ secrets.SOURCE_PP_TENANT_ID }}
      # source_pp_app_id: ${{ secrets.SOURCE_PP_APP_ID }}
      # source_pp_client_secret: ${{ secrets.SOURCE_PP_CLIENT_SECRET }}
